[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-report-automation"
version = "1.0.0"
description = "Desktop CSV-to-Excel sales reporting with approval, exchange rates and validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
sales-report = "sales_report.gui:run_gui"

[project.scripts]
sales-report-console = "sales_report.console:run_console"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
